<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GummyChums — Coming Soon</title>
<meta name="description" content="Three flavors are coming. India's most fun wellness gummy — join the list."/>
<link rel="icon" type="image/png" href="logo/gc-monogram.png"/>
<style>
  @font-face{font-family:'Manrope';src:url('fonts/Manrope-Variable.ttf') format('truetype');font-weight:200 800;font-display:swap}
  :root{--bg:#FBF7F1; --ink:#191316; --cherry:#DE1D61; --mango:#8DAA31; --orange:#F9740D;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%}
  body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    min-height:100svh;padding:clamp(22px,4vw,40px) 22px 96px}
  @media (hover:hover) and (pointer:fine){body{cursor:none}}
  /* soft flavor wash that briefly floods on tap */
  #wash{position:fixed;inset:0;z-index:0;opacity:0;pointer-events:none;transition:opacity .5s ease}

  #gcur{position:fixed;left:0;top:0;width:28px;height:28px;z-index:90;pointer-events:none;
    transform:translate(-50%,-50%);opacity:0;transition:opacity .25s;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
  #gcur svg{width:100%;height:100%;display:block;animation:gwob 4s ease-in-out infinite}
  @keyframes gwob{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
  #gcur.on{opacity:1} @media (hover:none){#gcur{display:none}}

  .top{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
  .logo-wrap{position:relative;display:inline-block;line-height:0}
  .logo-shield{position:absolute;inset:0;z-index:3}
  .logo{display:block;width:min(340px,64vw);height:auto;pointer-events:none;
    -webkit-user-drag:none;user-select:none;-webkit-touch-callout:none;
    opacity:0;animation:fade .8s .1s forwards}
  @keyframes fade{to{opacity:1}}
  .kick{font-weight:800;letter-spacing:.28em;text-transform:uppercase;font-size:11px;color:#191316aa}

  .stage{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:clamp(20px,3.5vw,34px);width:100%;padding:22px 0}

  .gummies{display:flex;gap:clamp(14px,4vw,42px);align-items:center;justify-content:center;flex-wrap:nowrap}
  .fruit{border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:10px;padding:0;-webkit-tap-highlight-color:transparent}
  @media (hover:hover) and (pointer:fine){.fruit{cursor:none}}
  .fruit svg{width:clamp(78px,24vw,150px);height:auto;display:block;
    filter:drop-shadow(0 14px 20px rgba(25,19,22,.18));
    transition:transform .25s cubic-bezier(.34,1.56,.64,1);animation:bob 5s ease-in-out infinite}
  .fruit:nth-child(2) svg{animation-delay:-1.6s}
  .fruit:nth-child(3) svg{animation-delay:-3.2s}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
  .fruit:hover svg{transform:scale(1.06)}
  .fruit.pop svg{animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{35%{transform:scale(1.18,.84)}70%{transform:scale(.92,1.1)}}
  .fruit b{font-weight:800;font-size:clamp(.8rem,2.4vw,1rem);letter-spacing:.01em}
  .fruit small{font-weight:600;font-size:clamp(.62rem,1.8vw,.75rem);opacity:.5;margin-top:-6px}

  .tag{font-weight:800;font-size:clamp(1.4rem,5vw,2.4rem);line-height:1.05;max-width:16ch}
  .sub{font-weight:600;font-size:clamp(.95rem,2.6vw,1.1rem);color:#191316b0;max-width:32ch;margin-top:-8px}

  form{display:flex;gap:8px;background:#fff;border-radius:999px;padding:6px 6px 6px 20px;
    box-shadow:0 18px 40px -20px rgba(25,19,22,.4);width:min(420px,92vw);position:relative;z-index:2}
  form input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;font-weight:600;font-size:1rem;color:var(--ink)}
  form input::placeholder{color:#19131666}
  form button{border:0;cursor:pointer;font-family:inherit;font-weight:800;font-size:.95rem;white-space:nowrap;
    color:#fff;background:var(--ink);border-radius:999px;padding:12px 22px;transition:transform .12s,background .3s}
  form button:active{transform:scale(.94)}
  .thanks{display:none;font-weight:800;font-size:1.05rem;color:var(--cherry);position:relative;z-index:2}
  .thanks.show{display:block;animation:pop2 .5s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop2{35%{transform:scale(1.05)}70%{transform:scale(.98)}}
  .consent{font-size:.72rem;font-weight:600;color:#19131688;position:relative;z-index:2}
  .hp{position:absolute!important;left:-9999px;width:1px;height:1px;overflow:hidden;opacity:0}

  .foot{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:4;
    display:flex;align-items:center;gap:14px;font-weight:700;font-size:.8rem;white-space:nowrap;color:#191316;
    background:#fff;padding:8px 18px;border-radius:999px;box-shadow:0 10px 26px -14px rgba(25,19,22,.4)}
  .foot a{color:inherit;text-decoration:none} .foot a:hover{text-decoration:underline}

  @media (max-width:520px){
    form{flex-direction:column;border-radius:22px;padding:12px;gap:10px}
    form input{text-align:center;padding:6px 0} form button{width:100%;padding:14px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.logo{opacity:1}}

/*MARQ*/
body{padding-top:46px!important}
.marq{position:fixed;left:0;right:0;z-index:20;overflow:hidden;pointer-events:none;padding:8px 0;background:var(--ink)}
.marq.top{top:0}.marq.bot{bottom:0}
.marq .trk{display:inline-flex;white-space:nowrap;color:#FCFAF6;font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.16em;animation:mscroll 55s linear infinite}
.marq.bot .trk{animation-direction:reverse}
.marq .trk span{padding:0 18px}
@keyframes mscroll{to{transform:translateX(-50%)}}
.foot{bottom:48px!important}
@media (prefers-reduced-motion:reduce){.marq .trk{animation:none!important}}
</style>
</head>
<body>
<div class="marq top"><div class="trk" id="mt"></div></div><div class="marq bot"><div class="trk" id="mb"></div></div>
<div id="wash"></div>
<div id="gcur" aria-hidden="true"><svg viewBox="0 0 100 100"><path d="M50 3C72 1 95 18 97 42C99 68 82 95 55 97C30 99 5 82 3 55C1 30 26 5 50 3Z" fill="#191316"/><ellipse cx="35" cy="28" rx="15" ry="9" fill="#fff" opacity=".9" transform="rotate(-25 35 28)"/></svg></div>

<div class="top">
  <span class="logo-wrap">
    <img class="logo" src="logo/gc-wordmark-stack.png" alt="gummy chums" draggable="false" oncontextmenu="return false"/>
    <span class="logo-shield" aria-hidden="true" oncontextmenu="return false"></span>
  </span>
  <p class="kick">Wellness, but make it fun</p>
</div>

<div class="stage">
  <div class="gummies" id="gummies">
    <button class="fruit" data-flavor="cherry" data-color="#DE1D61" aria-label="Cherry">
      <svg viewBox="0 0 100 100"><defs><radialGradient id="gCh" cx="38%" cy="30%" r="75%"><stop offset="0%" stop-color="#ff5f94"/><stop offset="60%" stop-color="#DE1D61"/><stop offset="100%" stop-color="#a51447"/></radialGradient></defs><path d="M50 3C72 1 95 18 97 42C99 68 82 95 55 97C30 99 5 82 3 55C1 30 26 5 50 3Z" fill="url(#gCh)"/><ellipse cx="36" cy="28" rx="16" ry="9.5" fill="#fff" opacity=".55" transform="rotate(-25 36 28)"/></svg>
      <b>Cherry</b><small>for calm nights</small>
    </button>
    <button class="fruit" data-flavor="mango" data-color="#8DAA31" aria-label="Mango">
      <svg viewBox="0 0 100 100"><defs><radialGradient id="gMa" cx="38%" cy="30%" r="75%"><stop offset="0%" stop-color="#c3e05f"/><stop offset="60%" stop-color="#8DAA31"/><stop offset="100%" stop-color="#5f7620"/></radialGradient></defs><path d="M50 3C72 1 95 18 97 42C99 68 82 95 55 97C30 99 5 82 3 55C1 30 26 5 50 3Z" fill="url(#gMa)"/><ellipse cx="36" cy="28" rx="16" ry="9.5" fill="#fff" opacity=".5" transform="rotate(-25 36 28)"/></svg>
      <b>Mango</b><small>for sharp focus</small>
    </button>
    <button class="fruit" data-flavor="orange" data-color="#F9740D" aria-label="Orange">
      <svg viewBox="0 0 100 100"><defs><radialGradient id="gOr" cx="38%" cy="30%" r="75%"><stop offset="0%" stop-color="#ffa34d"/><stop offset="60%" stop-color="#F9740D"/><stop offset="100%" stop-color="#b8500a"/></radialGradient></defs><path d="M50 3C72 1 95 18 97 42C99 68 82 95 55 97C30 99 5 82 3 55C1 30 26 5 50 3Z" fill="url(#gOr)"/><ellipse cx="36" cy="28" rx="16" ry="9.5" fill="#fff" opacity=".5" transform="rotate(-25 36 28)"/></svg>
      <b>Orange</b><small>for bright eyes</small>
    </button>
  </div>

  <h1 class="tag">Three flavors.<br/>One happy habit.</h1>
  <p class="sub">Something delicious is coming — tap a gummy for a taste. We launch soon.</p>

  <form id="notify" novalidate>
    <input id="email" type="email" placeholder="your@email.com" required aria-label="Email"/>
    <input type="text" name="company" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true"/>
    <button type="submit">Notify me</button>
  </form>
  <p class="thanks" id="thanks">You&rsquo;re on the list! 🎉</p>
  <p class="consent">No spam — just one email when we launch.</p>
</div>

<div class="foot">
  <a href="https://www.instagram.com/gummy.chums/" target="_blank" rel="noopener">Instagram</a>
  <span style="opacity:.4">·</span><span>Made in India 🇮🇳</span>
</div>

<script>
(function(){
  var wash=document.getElementById('wash');
  // splash on tapping a gummy
  function splashAt(x,y,color){
    var s=document.createElement('div');
    s.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;width:40px;height:40px;z-index:1;'+
      'margin:-20px 0 0 -20px;border-radius:46% 54% 52% 48%/48% 46% 54% 52%;pointer-events:none;'+
      'background:'+color+';opacity:.9;will-change:transform,opacity;';
    document.body.appendChild(s);
    s.animate([{transform:'scale(.2)',opacity:.85},{transform:'scale(26)',opacity:0}],
      {duration:750,easing:'cubic-bezier(.22,.7,.2,1)'}).onfinish=function(){s.remove();};
    // gentle full-screen wash of the flavor
    wash.style.background=color; wash.style.opacity='.16';
    clearTimeout(wash._t); wash._t=setTimeout(function(){wash.style.opacity='0';},480);
  }
  document.getElementById('gummies').addEventListener('pointerdown',function(e){
    var f=e.target.closest('.fruit'); if(!f)return;
    f.classList.remove('pop'); void f.offsetWidth; f.classList.add('pop');
    var r=f.querySelector('svg').getBoundingClientRect();
    splashAt(r.left+r.width/2, r.top+r.height/2, f.getAttribute('data-color'));
  });

  // gummy cursor
  if(matchMedia('(hover:hover) and (pointer:fine)').matches){
    var c=document.getElementById('gcur');
    addEventListener('pointermove',function(e){c.classList.add('on');c.style.left=e.clientX+'px';c.style.top=e.clientY+'px';});
    document.addEventListener('mouseleave',function(){c.classList.remove('on');});
  }
  // logo save deterrent
  var lw=document.querySelector('.logo-wrap');
  if(lw){lw.addEventListener('contextmenu',function(e){e.preventDefault();});lw.addEventListener('dragstart',function(e){e.preventDefault();});}

  // Klaviyo signup (client-side, no backend) — same list as the live site
  var KLAVIYO_PUBLIC_KEY='RVzvWv',KLAVIYO_LIST_ID='UaVrj2';
  var f=document.getElementById('notify'),th=document.getElementById('thanks'),
      emailEl=document.getElementById('email'),btn=f.querySelector('button'),hp=f.querySelector('.hp'),lbl=btn.textContent;
  var RE=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
  f.addEventListener('submit',function(e){e.preventDefault(); if(hp&&hp.value)return;
    var em=emailEl.value.trim(); if(!RE.test(em)){emailEl.focus();return;}
    btn.disabled=true;btn.textContent='Joining…';
    fetch('https://a.klaviyo.com/client/subscriptions/?company_id='+KLAVIYO_PUBLIC_KEY,{
      method:'POST',headers:{'Content-Type':'application/json','revision':'2024-10-15'},
      body:JSON.stringify({data:{type:'subscription',attributes:{custom_source:'Coming Soon (splash)',
        profile:{data:{type:'profile',attributes:{email:em}}}},relationships:{list:{data:{type:'list',id:KLAVIYO_LIST_ID}}}}})
    }).then(function(r){ if(r.status===202||r.ok){f.style.display='none';th.classList.add('show');}
      else{throw new Error(r.status);} }).catch(function(){btn.disabled=false;btn.textContent=lbl;
        emailEl.value='';emailEl.setAttribute('placeholder','Try again');emailEl.focus();});
  });
})();

;/*MARQJS*/(function(){var msg='GUMMY CHUMS \u2726 COMING SOON \u2726 WELLNESS, BUT MAKE IT FUN \u2726 MADE IN INDIA \u2726 ';
function fill(el){if(!el)return;var o='';for(var i=0;i<6;i++)o+='<span>'+msg+'</span>';el.innerHTML=o+o;}
fill(document.getElementById('mt'));fill(document.getElementById('mb'));
var TR=['#DE1D61','#8DAA31','#F9740D'],ti=0,lt=0;
if(matchMedia('(hover:hover) and (pointer:fine)').matches){addEventListener('pointermove',function(e){
var n=performance.now();if(n-lt<42)return;lt=n;var d=document.createElement('div');
d.style.cssText='position:fixed;left:'+e.clientX+'px;top:'+e.clientY+'px;width:16px;height:16px;z-index:6;margin:-8px 0 0 -8px;border-radius:50%;pointer-events:none;background:'+TR[ti++%3]+';opacity:.5;will-change:transform,opacity;';
document.body.appendChild(d);d.animate([{transform:'scale(1)',opacity:.5},{transform:'scale(2.6)',opacity:0}],{duration:720,easing:'ease-out'}).onfinish=function(){d.remove();};});}
})();
</script>
</body>
</html>
