<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- Grain tile for the "grainy gradients and tactile textures" the brand book
       asks for. Kept as a standalone asset rather than an inline data URI so the
       browser rasterises the turbulence once and then just tiles the result —
       an inline SVG filter would be re-evaluated per element that used it. -->
  <filter id="g">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="180" height="180" filter="url(#g)" opacity="0.55"/>
</svg>
